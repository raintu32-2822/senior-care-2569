<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คู่มือเลือกสถานดูแลผู้สูงอายุ</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: sans-serif;
        }
        .book-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .page {
            flex: 0 0 100%;
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .page img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }
        .hint {
            position: fixed;
            bottom: 10px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="page"><img src="01.png" alt="หน้า 1"></div>
        <div class="page"><img src="02.png" alt="หน้า 2"></div>
        <div class="page"><img src="03.png" alt="หน้า 3"></div>
        <div class="page"><img src="04.png" alt="หน้า 4"></div>
        <div class="page"><img src="05.png" alt="หน้า 5"></div>
    </div>

    <div class="hint">ปัดซ้าย-ขวาเพื่อเปลี่ยนหน้า ➔</div>

</body>
</html>
